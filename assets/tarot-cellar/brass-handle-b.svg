<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657 241" width="657" height="241" role="img" aria-label="Antique brass drawer pull handle">
  <defs>
    <!-- Antique brass palette -->
    <linearGradient id="brassBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8BE61"/>
      <stop offset="0.15" stop-color="#B77932"/>
      <stop offset="0.38" stop-color="#5D3716"/>
      <stop offset="0.58" stop-color="#C9903B"/>
      <stop offset="0.78" stop-color="#7A4A1C"/>
      <stop offset="1" stop-color="#2B1709"/>
    </linearGradient>

    <linearGradient id="handleTube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D080"/>
      <stop offset="0.12" stop-color="#D39B45"/>
      <stop offset="0.30" stop-color="#8A561E"/>
      <stop offset="0.52" stop-color="#C98F3B"/>
      <stop offset="0.64" stop-color="#F4D58C"/>
      <stop offset="0.74" stop-color="#9A621F"/>
      <stop offset="1" stop-color="#2A1608"/>
    </linearGradient>

    <radialGradient id="knobGlow" cx="43%" cy="28%" r="67%">
      <stop offset="0" stop-color="#FFE4A1"/>
      <stop offset="0.18" stop-color="#D99C45"/>
      <stop offset="0.48" stop-color="#7A4318"/>
      <stop offset="0.78" stop-color="#321807"/>
      <stop offset="1" stop-color="#120805"/>
    </radialGradient>

    <radialGradient id="screwGlow" cx="40%" cy="28%" r="70%">
      <stop offset="0" stop-color="#FFE3A0"/>
      <stop offset="0.35" stop-color="#A56E28"/>
      <stop offset="0.75" stop-color="#3A1E0C"/>
      <stop offset="1" stop-color="#120805"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#050103" flood-opacity="0.70"/>
    </filter>

    <filter id="innerRoughness" x="-15%" y="-30%" width="130%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.34  0 0 0 0 0.12  0 0 0 .15 0" result="patina"/>
      <feBlend in="SourceGraphic" in2="patina" mode="multiply"/>
    </filter>

    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#050103" flood-opacity="0.65"/>
    </filter>

    <path id="leftPlate" d="M44 45 L135 45 L158 66 L158 112 L135 134 L44 134 Q28 134 21 120 L21 59 Q29 45 44 45 Z"/>
    <path id="rightPlate" d="M613 45 L522 45 L499 66 L499 112 L522 134 L613 134 Q629 134 636 120 L636 59 Q628 45 613 45 Z"/>
  </defs>

  <!-- transparent canvas; all visual elements are isolated asset shapes -->

  <!-- deep cast shadow under the hanging pull -->
  <path d="M108 86 C96 139 91 171 127 196 C162 219 496 219 530 196 C566 171 561 139 549 86"
        fill="none" stroke="#050203" stroke-width="34" stroke-linecap="round" opacity="0.55"/>

  <!-- mounting back plates -->
  <g filter="url(#plateShadow)">
    <use href="#leftPlate" fill="url(#brassBase)" stroke="#2A1609" stroke-width="4"/>
    <use href="#rightPlate" fill="url(#brassBase)" stroke="#2A1609" stroke-width="4"/>

    <!-- inner bevel lines -->
    <path d="M49 56 L128 56 L145 72 L145 106 L128 122 L49 122 Q39 122 34 113 L34 66 Q39 56 49 56 Z"
          fill="none" stroke="#E0B85A" stroke-width="2" opacity="0.42"/>
    <path d="M608 56 L529 56 L512 72 L512 106 L529 122 L608 122 Q618 122 623 113 L623 66 Q618 56 608 56 Z"
          fill="none" stroke="#E0B85A" stroke-width="2" opacity="0.42"/>
    <path d="M48 131 L137 131 L158 111" fill="none" stroke="#130704" stroke-width="2" opacity="0.70"/>
    <path d="M609 131 L520 131 L499 111" fill="none" stroke="#130704" stroke-width="2" opacity="0.70"/>
  </g>

  <!-- screws -->
  <g filter="url(#innerRoughness)">
    <circle cx="69" cy="89" r="15" fill="url(#screwGlow)" stroke="#1C0D05" stroke-width="3"/>
    <circle cx="588" cy="89" r="15" fill="url(#screwGlow)" stroke="#1C0D05" stroke-width="3"/>
    <path d="M59 89 L79 89" stroke="#241106" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M578 89 L598 89" stroke="#241106" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M62 83 C66 77 75 77 79 84" fill="none" stroke="#FFD989" stroke-width="2" opacity="0.35"/>
    <path d="M581 83 C585 77 594 77 598 84" fill="none" stroke="#FFD989" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- hinge collars / knobs -->
  <g filter="url(#softShadow)">
    <ellipse cx="124" cy="90" rx="38" ry="47" fill="#140805" opacity="0.58"/>
    <ellipse cx="533" cy="90" rx="38" ry="47" fill="#140805" opacity="0.58"/>
    <circle cx="126" cy="85" r="38" fill="url(#knobGlow)" stroke="#1D0C05" stroke-width="4" filter="url(#innerRoughness)"/>
    <circle cx="531" cy="85" r="38" fill="url(#knobGlow)" stroke="#1D0C05" stroke-width="4" filter="url(#innerRoughness)"/>
    <circle cx="118" cy="72" r="13" fill="#FFE0A0" opacity="0.42"/>
    <circle cx="523" cy="72" r="13" fill="#FFE0A0" opacity="0.42"/>
  </g>

  <!-- main U-shaped drawer pull as thick rounded stroke -->
  <g filter="url(#softShadow)">
    <path d="M125 91 C118 127 112 164 141 187 C176 215 481 215 516 187 C545 164 539 127 532 91"
          fill="none" stroke="#201006" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M125 91 C118 127 112 164 141 187 C176 215 481 215 516 187 C545 164 539 127 532 91"
          fill="none" stroke="url(#handleTube)" stroke-width="43" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerRoughness)"/>

    <!-- lower dark edge for cylindrical depth -->
    <path d="M128 107 C122 136 119 163 148 183 C184 207 473 207 509 183 C538 163 535 136 529 107"
          fill="none" stroke="#2A1407" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

    <!-- long brushed highlight on the handle top/front -->
    <path d="M154 171 C201 184 456 184 503 171"
          fill="none" stroke="#FFE3A1" stroke-width="8" stroke-linecap="round" opacity="0.62"/>
    <path d="M164 166 C221 176 436 176 493 166"
          fill="none" stroke="#FFF0B8" stroke-width="3" stroke-linecap="round" opacity="0.42"/>

    <!-- vertical side highlights -->
    <path d="M128 98 C123 121 123 143 137 160" fill="none" stroke="#F1C978" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <path d="M529 98 C534 121 534 143 520 160" fill="none" stroke="#F1C978" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- subtle patina flecks on metal, clipped visually by low opacity small marks -->
  <g opacity="0.22" stroke-linecap="round" filter="url(#innerRoughness)">
    <path d="M223 177 L238 176" stroke="#5B3515" stroke-width="2"/>
    <path d="M278 181 L292 180" stroke="#F2CB74" stroke-width="1.4"/>
    <path d="M350 180 L372 179" stroke="#5A3213" stroke-width="2"/>
    <path d="M418 177 L437 176" stroke="#F0C76E" stroke-width="1.5"/>
    <path d="M97 60 L115 57" stroke="#F2CC77" stroke-width="1.3"/>
    <path d="M542 57 L560 60" stroke="#F2CC77" stroke-width="1.3"/>
  </g>
</svg>
