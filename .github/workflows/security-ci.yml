name: security-ci

on:
  pull_request:
  push:
    branches: ["main", "work"]

# 어떤 잡도 저장소에 쓰지 않는다. 기본 GITHUB_TOKEN 권한을 읽기로 줄인다.
permissions:
  contents: read

jobs:
  typecheck-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app

  typecheck-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run typecheck:edge

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # 이 잡은 시크릿을 받지 않는다. 쓰는 단계가 없는데 잡 전체 env 로 두면
  # npm ci 의 설치 스크립트까지 Google 키·service_role 키를 읽을 수 있었다.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security-check
      - run: bash scripts/verify-ai-proxy-config.sh
      # npm audit --audit-level=high 를 직접 쓰지 않는다. 업스트림에 패치가 없는 권고
      # 하나 때문에 게이트가 영구히 실패하면 아무도 안 보게 된다. audit-gate 는
      # high/critical 을 그대로 차단하되, 근거와 재검토 기한을 적어둔 권고만 통과시킨다.
      - run: npm run audit-gate
