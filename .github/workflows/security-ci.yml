name: security-ci

on:
  pull_request:
  push:
    branches: ["main", "work"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/security-check.sh
      - run: npm audit --audit-level=high
