name: security-ci

on:
  pull_request:
  push:
    branches: ["main", "work"]

jobs:
  typecheck-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app

  typecheck-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run typecheck:edge

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    runs-on: ubuntu-latest
    env:
      AI_PROXY_REQUIRE_AUTH: true
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run security-check
      - run: bash scripts/verify-ai-proxy-config.sh
      # npm audit --audit-level=high 를 직접 쓰지 않는다. 업스트림에 패치가 없는 권고
      # 하나 때문에 게이트가 영구히 실패하면 아무도 안 보게 된다. audit-gate 는
      # high/critical 을 그대로 차단하되, 근거와 재검토 기한을 적어둔 권고만 통과시킨다.
      - run: npm run audit-gate
